  <circle cx="150" cy="150" r="72" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <circle cx="150" cy="150" r="58" fill="#161412"/>
  <text x="150" y="162" text-anchor="middle" fill="#f5f0ea" font-family="system-ui, sans-serif" font-size="34" font-weight="700">In</text>
  <text x="260" y="145" fill="#f5f0ea" font-family="system-ui, sans-serif" font-size="64" font-weight="700">Inspector</text>
  <text x="260" y="210" fill="#b5a89c" font-family="system-ui, sans-serif" font-size="30">Monitore APIs, webhooks e alertas</text>
