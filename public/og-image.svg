<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Inspector">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120f0d"/>
      <stop offset="55%" stop-color="#0c0b0a"/>
      <stop offset="100%" stop-color="#161412"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#dd2a7b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dd2a7b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58529"/>
      <stop offset="35%" stop-color="#dd2a7b"/>
      <stop offset="70%" stop-color="#8134af"/>
      <stop offset="100%" stop-color="#515bd4"/>
