name: inspector-prod

x-app-common: &app-common
    build:
        context: .
        dockerfile: Dockerfile
    image: '${APP_IMAGE:-inspector-app}:latest'
    restart: unless-stopped
    env_file:
        - .env.production
    volumes:
        - app_storage:/var/www/html/storage/app
        - app_logs:/var/www/html/storage/logs
    networks:
        - inspector

services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        environment:
            DOMAIN: '${DOMAIN:-localhost}'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - inspector
        depends_on:
            app:
                condition: service_healthy

    app:
        <<: *app-common
        environment:
            RUN_MIGRATIONS: 'true'
            CACHE_CONFIG: 'true'
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - curl
                - '-f'
                - 'http://127.0.0.1/up'
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

    queue:
        <<: *app-common
        command:
            - php
            - artisan
            - queue:work
            - '--sleep=3'
            - '--tries=3'
            - '--max-time=3600'
        environment:
            RUN_MIGRATIONS: 'false'
            CACHE_CONFIG: 'true'
        depends_on:
            app:
                condition: service_healthy
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        <<: *app-common
        command:
            - php
            - artisan
            - schedule:work
        environment:
            RUN_MIGRATIONS: 'false'
            CACHE_CONFIG: 'true'
        depends_on:
            app:
                condition: service_healthy
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    pgsql:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-inspector}'
            POSTGRES_USER: '${DB_USERNAME:-inspector}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - pgsql_data:/var/lib/postgresql
        networks:
            - inspector
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-inspector}'
                - '-U'
                - '${DB_USERNAME:-inspector}'
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:alpine
        restart: unless-stopped
        command:
            - redis-server
            - '--appendonly'
            - 'yes'
        volumes:
            - redis_data:/data
        networks:
            - inspector
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 5s
            retries: 10

networks:
    inspector:
        driver: bridge

volumes:
    caddy_data:
    caddy_config:
    pgsql_data:
    redis_data:
    app_storage:
    app_logs:
